# Deployment build of this fork: Casdoor v4.25.0 + cross-organization application grants.
# Builds one immutable image, tests that exact digest (unit tests, PostgreSQL upgrade and
# rollback against the stock image, HTTP end-to-end flows), scans it and only then tags it
# and attests its provenance. Uses synthetic test data only.
name: Albweb image

on:
  push:
    branches:
      - albweb/v4.25.0-cross-org-access
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: albweb-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/justanotherdevguy/casdoor
  # the stock image currently deployed, used before the upgrade and after the rollback
  STOCK_IMAGE: docker.io/casbin/casdoor@sha256:a63e7a78257c43c90b22a49bf93becca7007dc47b4f97bec763aa50bcc9c9ee9
  POSTGRES_IMAGE: postgres:18.6

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: go.mod
      - run: go vet ./object/ ./controllers/ ./routers/
      - run: go test ./object/ -run 'TestApplicationGrant' -count=1 -v

  image:
    name: Build image
    needs: unit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # build.sh stamps the version from the git history and tags
          fetch-depth: 0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: STANDARD
          platforms: linux/amd64
          push: true
          # a candidate tag; the release tag is only added after the digest passed every test
          tags: ${{ env.IMAGE }}:candidate-${{ github.sha }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Casdoor v4.25.0 with cross-organization application grants

  migration-e2e:
    name: PostgreSQL upgrade, end-to-end and rollback
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      CANDIDATE: ghcr.io/justanotherdevguy/casdoor@${{ needs.image.outputs.digest }}
      CASDOOR_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start a disposable PostgreSQL
        run: |
          docker run -d --name pg --network host -e POSTGRES_USER=casdoor -e POSTGRES_PASSWORD=casdoor -e POSTGRES_DB=casdoor "$POSTGRES_IMAGE"
          for i in $(seq 1 60); do docker exec pg pg_isready -U casdoor -d casdoor && break; sleep 1; done
      - name: Prepare the configuration
        run: |
          pass=$(openssl rand -hex 16)
          echo "::add-mask::$pass"
          echo "CASDOOR_ADMIN_PASSWORD=$pass" >> "$GITHUB_ENV"
          cat > casdoor.env <<EOF
          driverName=postgres
          dataSourceName=user=casdoor password=casdoor host=127.0.0.1 port=5432 sslmode=disable dbname=casdoor
          dbName=casdoor
          origin=http://127.0.0.1:8000
          initDataFile=/seed/seed.json
          initDataMerge=true
          initAdminPassword=$pass
          EOF
          cat > start.sh <<'EOF'
          #!/bin/sh
          set -eu
          docker rm -f casdoor >/dev/null 2>&1 || true
          docker run -d --name casdoor --network host --env-file casdoor.env -v "$PWD/e2e/application-grant:/seed:ro" "$1"
          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:8000/api/health >/dev/null && exit 0
            sleep 1
          done
          docker logs casdoor | tail -50
          exit 1
          EOF
          chmod +x start.sh
      - name: "1. Stock v4.25.0 creates the schema"
        run: |
          ./start.sh "$STOCK_IMAGE"
          python3 -I e2e/application-grant/run.py --baseline
      - name: "2. Upgrade to the candidate on the same database"
        run: |
          docker stop casdoor
          ./start.sh "$CANDIDATE"
          docker exec pg psql -U casdoor -d casdoor -At -c "select count(*) from information_schema.tables where table_name='application_grant'" | grep -qx 1
          docker exec pg psql -U casdoor -d casdoor -At -c "select count(*) from information_schema.columns where table_name='token' and column_name='is_grant_access'" | grep -qx 1
          echo "Additive schema change verified: table application_grant, column token.is_grant_access"
          python3 -I e2e/application-grant/run.py --baseline
          python3 -I e2e/application-grant/run.py
      - name: "3. Roll the image back to stock v4.25.0 on the upgraded database"
        run: |
          docker stop casdoor
          ./start.sh "$STOCK_IMAGE"
          python3 -I e2e/application-grant/run.py --baseline
          docker logs casdoor 2>&1 | grep -i "panic" && exit 1 || true
      - name: Server logs
        if: failure()
        run: docker logs casdoor 2>&1 | tail -200

  scan:
    name: Vulnerability scan
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      CANDIDATE: ghcr.io/justanotherdevguy/casdoor@${{ needs.image.outputs.digest }}
      TRIVY_IMAGE: aquasec/trivy:0.75.0
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan the candidate and the stock image
        run: |
          scan() {
            docker run --rm -v "$HOME/.docker:/root/.docker:ro" -v "$PWD:/out" "$TRIVY_IMAGE" image \
              --scanners vuln --severity HIGH,CRITICAL --format json --output "/out/$2.json" "$1"
          }
          scan "$CANDIDATE" candidate
          scan "$STOCK_IMAGE" stock
          python3 - <<'EOF'
          import json, os
          def vulns(path):
              data = json.load(open(path))
              return {(v["VulnerabilityID"], v["PkgName"], v["Severity"], v.get("FixedVersion", ""))
                      for r in data.get("Results") or [] for v in r.get("Vulnerabilities") or []}
          cand, stock = vulns("candidate.json"), vulns("stock.json")
          new = sorted(cand - stock)
          lines = ["## Trivy (HIGH, CRITICAL)", "",
                   f"candidate: {len(cand)} findings, stock v4.25.0: {len(stock)} findings, introduced by this build: {len(new)}", ""]
          lines += [f"- {v[2]} {v[0]} {v[1]} (fixed in {v[3] or 'n/a'})" for v in new]
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(lines) + "\n")
          print("\n".join(lines))
          if any(v[2] == "CRITICAL" for v in new):
              raise SystemExit("the candidate introduces CRITICAL vulnerabilities")
          EOF

  release:
    name: Tag and attest
    needs: [image, migration-e2e, scan]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.image.outputs.digest }}
          push-to-registry: true
      - name: Tag the tested digest
        run: |
          tag="4.25.0-xorg.${GITHUB_RUN_NUMBER}-${GITHUB_SHA::8}"
          docker buildx imagetools create -t "$IMAGE:$tag" "$IMAGE@${{ needs.image.outputs.digest }}"
          {
            echo "## Released"
            echo
            echo "\`$IMAGE:$tag@${{ needs.image.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
